modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
updateJSONURL = "https://littleperson101.github.io/pokeloader/forge_update_seeker.json"
displayURL="https://modrinth.com/project/pokeloader"
logoFile="assets/pokeloader/icon.png"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config = "pokeloader.mixins.json"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId ="yet_another_config_lib_v3"
    mandatory = true
    versionRange = "[3.6.1,)"
    ordering = "NONE"
    side = "CLIENT"

